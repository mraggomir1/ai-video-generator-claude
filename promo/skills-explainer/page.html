<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--pink:#ff3d8b;--yellow:#ffd23f;--violet:#7b5cff;--green:#3ddc97;--red:#ff4d4d;--txt:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#0d0a14;font-family:"Inter Display","Inter",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(110,60,200,.55),rgba(40,20,70,.25) 38%,rgba(13,10,20,0) 65%),#0d0a14}
#flash{position:absolute;inset:0;background:#7a2a5c;opacity:0}
#headline{position:absolute;top:44px;left:0;right:0;text-align:center;font-weight:900;font-size:40px;line-height:1.02;letter-spacing:.5px;text-transform:uppercase;text-shadow:0 0 18px rgba(255,255,255,.25)}
#headline .y{color:var(--yellow);text-shadow:0 0 18px rgba(255,210,63,.45)}
#headline .p{color:var(--pink);text-shadow:0 0 18px rgba(255,61,139,.5)}
.layer{position:absolute;left:0;right:0;top:150px;height:470px;opacity:0}
#mascot{position:absolute;left:50%;top:640px;width:180px;height:130px;margin-left:-90px;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 18px rgba(170,130,255,.8))}
#caption{position:absolute;left:24px;right:24px;top:800px;font-weight:700;font-size:23px;line-height:1.3;text-align:center}
#caption span{transition:none}
.w-dim{color:rgba(255,255,255,.28)} .w-on{color:#fff} .w-hl{color:var(--pink)}
/* shared */
.card{position:absolute;border-radius:16px;background:rgba(30,22,48,.92);border:1.5px solid rgba(255,255,255,.14)}
.tile{position:absolute;border-radius:12px;background:#221a33;border:1.5px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:700;font-size:17px;color:rgba(255,255,255,.35)}
.tile b{font-size:13px;font-weight:800;color:rgba(255,255,255,.35);width:22px}
.chip{position:absolute;padding:12px 18px;border-radius:14px;font-weight:800;font-size:24px;background:#2a1f40;border:2px solid var(--pink);box-shadow:0 0 22px rgba(255,61,139,.45)}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:var(--pink);text-shadow:0 0 30px rgba(255,61,139,.6)}
.mono{font-family:"DejaVu Sans Mono",monospace}
</style></head>
<body><div id="stage">
<div id="bg"></div><div id="flash"></div>
<div id="headline"></div>

<!-- HOOK -->
<div class="layer" id="L-hook">
  <div id="hookGrid"></div>
  <div class="big" id="hook10" style="top:120px;font-size:200px;line-height:1">10</div>
  <div class="big" id="hookSub" style="top:340px;font-size:30px;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.4)">скиллов</div>
</div>

<!-- SLOP -->
<div class="layer" id="L-slop">
  <div class="card" id="slopBubble" style="left:60px;right:60px;top:20px;height:74px;display:flex;align-items:center;padding:0 22px;font-size:24px;font-weight:700"><span id="slopTyped"></span><span id="slopCaret" style="color:var(--pink)">|</span></div>
  <div id="slopBox" style="position:absolute;left:90px;right:90px;top:130px;height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#6b6474,#3a3542 60%,#57505e)">
    <div id="slopBlur" style="position:absolute;inset:0;filter:blur(10px)">
      <div style="position:absolute;left:40px;top:60px;width:120px;height:120px;border-radius:50%;background:#8d8496"></div>
      <div style="position:absolute;right:30px;top:120px;width:140px;height:90px;border-radius:20px;background:#77707f"></div>
      <div style="position:absolute;left:20px;bottom:20px;right:20px;height:40px;border-radius:10px;background:#9a92a2"></div>
    </div>
    <div style="position:absolute;left:0;right:0;top:118px;text-align:center;font-weight:900;font-size:44px;color:rgba(255,255,255,.55);letter-spacing:2px">AI SLOP</div>
  </div>
  <svg id="slopX" viewBox="0 0 100 100" style="position:absolute;left:170px;top:180px;width:200px;height:200px;filter:drop-shadow(0 0 10px rgba(255,77,77,.8))"><path id="x1" d="M12 12 L88 88" stroke="#ff4d4d" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" fill="none"/><path id="x2" d="M88 12 L12 88" stroke="#ff4d4d" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" fill="none"/></svg>
</div>

<!-- ENGINE -->
<div class="layer" id="L-engine">
  <div class="card" id="engCore" style="left:170px;width:200px;top:40px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-color:var(--violet);box-shadow:0 0 40px rgba(123,92,255,.45)">
    <div style="font-weight:900;font-size:28px">Seedance</div><div style="font-weight:800;font-size:20px;color:var(--violet)">2.0</div>
  </div>
  <div class="chip" id="c0" style="left:40px;top:220px">⏱ секунды</div>
  <div class="chip" id="c1" style="right:40px;top:220px;border-color:var(--yellow);box-shadow:0 0 22px rgba(255,210,63,.45)">🎥 камера</div>
  <div class="chip" id="c2" style="left:70px;top:320px;border-color:var(--violet);box-shadow:0 0 22px rgba(123,92,255,.5)">💡 свет</div>
  <div class="chip" id="c3" style="right:70px;top:320px;border-color:var(--green);box-shadow:0 0 22px rgba(61,220,151,.45)">🔊 звук</div>
</div>

<!-- PROMPT -->
<div class="layer" id="L-prompt">
  <div class="card" id="ideaCard" style="left:40px;top:30px;width:150px;height:90px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;border-color:var(--yellow);box-shadow:0 0 24px rgba(255,210,63,.4)">💡 идея</div>
  <svg id="arrow" viewBox="0 0 200 40" style="position:absolute;left:200px;top:55px;width:120px;height:40px"><path d="M5 20 H180 M165 6 L185 20 L165 34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" id="arrowPath"/></svg>
  <div class="card" id="promptCard" style="left:40px;right:40px;top:140px;height:320px;padding:14px 16px;overflow:hidden;border-color:var(--pink);box-shadow:0 0 28px rgba(255,61,139,.35)">
    <div class="mono" id="promptLines" style="font-size:12.5px;line-height:1.55;color:#e8e2f5"></div>
  </div>
  <div id="lineCount" style="position:absolute;right:30px;top:118px;padding:6px 12px;border-radius:10px;background:var(--pink);font-weight:900;font-size:20px;box-shadow:0 0 20px rgba(255,61,139,.6)">0 строк</div>
</div>

<!-- GRID -->
<div class="layer" id="L-grid"><div id="skillGrid"></div></div>

<!-- HOOK2S -->
<div class="layer" id="L-hook2s">
  <div class="big" id="sec" style="top:10px;font-size:150px;line-height:1">2<span style="font-size:60px"> сек</span></div>
  <div style="position:absolute;left:50px;right:50px;top:230px">
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin-bottom:8px"><span>уйдут</span><span id="v1" style="color:var(--red)">0%</span></div>
    <div style="height:30px;border-radius:15px;background:#2a2238;overflow:hidden"><div id="b1" style="height:100%;width:0;background:var(--red);box-shadow:0 0 20px var(--red)"></div></div>
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:26px 0 8px"><span>останутся</span><span id="v2" style="color:var(--green)">0%</span></div>
    <div style="height:30px;border-radius:15px;background:#2a2238;overflow:hidden"><div id="b2" style="height:100%;width:0;background:var(--green);box-shadow:0 0 20px var(--green)"></div></div>
  </div>
</div>

<!-- CTA -->
<div class="layer" id="L-cta">
  <div class="card" id="term" style="left:36px;right:36px;top:30px;height:150px;padding:0;overflow:hidden">
    <div style="height:30px;background:#2c2340;display:flex;align-items:center;gap:7px;padding-left:12px"><i style="width:11px;height:11px;border-radius:50%;background:#ff5f57"></i><i style="width:11px;height:11px;border-radius:50%;background:#febc2e"></i><i style="width:11px;height:11px;border-radius:50%;background:#28c840"></i></div>
    <div class="mono" style="padding:16px;font-size:17px;line-height:1.6"><span style="color:var(--green)">$</span> <span id="termTyped"></span><span id="termCaret">▍</span><div id="termOk" style="color:var(--green);opacity:0">✓ 10 скиллов установлено</div></div>
  </div>
  <div id="flow" style="position:absolute;left:0;right:0;top:230px;display:flex;justify-content:center;gap:10px;font-weight:900;font-size:24px">
    <span class="fl" style="padding:10px 14px;border-radius:12px;background:#2a1f40;border:2px solid var(--yellow)">идея</span><span class="fl" style="align-self:center">→</span>
    <span class="fl" style="padding:10px 14px;border-radius:12px;background:#2a1f40;border:2px solid var(--pink)">промпт</span><span class="fl" style="align-self:center">→</span>
    <span class="fl" style="padding:10px 14px;border-radius:12px;background:#2a1f40;border:2px solid var(--green)">видео</span>
  </div>
</div>

<!-- MASCOT: glowing clapperboard -->
<svg id="mascot" viewBox="0 0 180 130">
  <g id="mBody" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <g id="mArm" style="transform-origin:28px 44px"><path d="M28 44 L152 30 L154 44 L30 58 Z"/><path d="M52 41 L64 55 M80 38 L92 52 M108 35 L120 49 M136 32 L148 46"/></g>
    <rect x="28" y="58" width="126" height="64" rx="8"/>
    <path d="M28 72 H154"/>
    <g id="mEyes"><ellipse id="e1" cx="72" cy="96" rx="6" ry="8" fill="#fff"/><ellipse id="e2" cx="110" cy="96" rx="6" ry="8" fill="#fff"/></g>
    <path id="mMouth" d="M84 110 Q91 116 98 110"/>
  </g>
</svg>

<div id="caption"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);                 // ease out
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // overshoot
const pop=(el,p,from=.4)=>{el.style.opacity=clamp(p*3);el.style.transform=`scale(${from+(1-from)*back(p)})`};
let D=null;
function wt(sc,word,nth=0){let k=0;for(const w of sc.words){if(w.w.toLowerCase().replace(/[^\p{L}\d-]/gu,'').startsWith(word)){if(k===nth)return w.t;k++}}return sc.start}

// --- static builders
function build(data){
  D=data;
  // hook grid: 10 tiles behind
  let h='';for(let i=0;i<10;i++){const c=i%2,r=Math.floor(i/2);h+=`<div class="tile" id="hg${i}" style="left:${70+c*205}px;top:${30+r*82}px;width:195px;height:70px;justify-content:center;font-size:26px;opacity:.5"><b style="width:auto;font-size:26px">${String(i+1).padStart(2,'0')}</b></div>`}
  $('hookGrid').innerHTML=h;
  const skills=[['01','Вирусный хук','v'],['02','Запуск SaaS','b'],['03','Личный бренд','r'],['04','Промо курса','b'],['05','Безликий канал','v'],['06','Люкс-эстетика','r'],['07','До / После','r'],['08','Отзывы','b'],['09','ИИ-аватар','r'],['10','Подкаст в видео','v']];
  let g='';skills.forEach((s,i)=>{const c=i%2,r=Math.floor(i/2);g+=`<div class="tile" data-g="${s[2]}" id="sk${i}" style="left:${26+c*248}px;top:${20+r*88}px;width:240px;height:76px"><b>${s[0]}</b>${s[1]}</div>`});
  $('skillGrid').innerHTML=g;
}
const PROMPT=["[0:00-0:02] HOOK: snap zoom на лицо,","  вспышка света, бас-удар","[0:02-0:05] dolly forward 3ft, f/1.4","[0:05-0:07] rack focus → продукт","LIGHT: key 45°, rim неон-пинк","  practical: тёплый 3200K","[0:07-0:10] orbit 180°, slow-mo","SOUND: ambient + whoosh @0:02","  музыка: drop @0:07","VOICE: «Это меняет всё»","[0:10-0:12] whip pan → логотип","@image1 — продукт, @audio1 — трек","PLATFORM: 9:16, safe zone 14%","LOOP: финал = первый кадр"];
const HEAD={hook:'Твой ИИ<br><span class="y">снимет круче?</span>',slop:'Почему<br><span class="y">получается мыло?</span>',engine:'Seedance 2.0<br><span class="y">любит точность</span>',prompt:'1 идея →<br><span class="y">готовый промпт</span>',grid:'10 скиллов<br><span class="y">для Claude</span>',hook2s:'Первые<br><span class="y">2 секунды</span>',cta:'Забирай<br><span class="y">скиллы</span>'};

function render(t){
  const S=D.scenes; let si=S.findIndex(s=>t>=s.start&&t<s.end); if(si<0) si=t<S[0].start?0:S.length-1;
  const sc=S[si], lt=t-sc.start;
  // layers fade
  for(const s of S){const el=$('L-'+s.id);const on=s===sc;const p=on?eo((t-s.start)/.25):0;el.style.opacity=p;el.style.transform=`translateY(${(1-p)*20}px)`}
  // headline
  const hl=$('headline'); if(hl.dataset.k!==sc.id){hl.innerHTML=HEAD[sc.id];hl.dataset.k=sc.id}
  const hp=back(lt/.35); hl.style.transform=`scale(${.7+.3*hp})`; hl.style.opacity=clamp(lt/.15);
  // bg breathing + flash
  $('bg').style.transform=`scale(${1+.03*Math.sin(t*1.3)})`;
  let fl=0;
  // ---------- scenes
  if(sc.id==='hook'){
    const t10=wt(sc,'десять');
    for(let i=0;i<10;i++){const e=$('hg'+i);const p=eo((t-(sc.start+.1+i*.06))/.3);e.style.opacity=.15+.35*p;e.style.transform=`scale(${.8+.2*p})`}
    const p=(t-sc.start-.2)/.5; const e=$('hook10'); pop(e,p,.3);
    const pulse=t>t10?Math.exp(-(t-t10)*5)*.25:0; e.style.transform=`scale(${(.3+.7*back(p))*(1+pulse)}) rotate(${-4+4*eo(p)}deg)`;
    const s=$('hookSub');s.style.opacity=clamp((t-t10)/.2);s.style.transform=`translateY(${(1-eo((t-t10)/.3))*20}px)`;
    if(t>t10) fl=Math.max(0,.5-(t-t10)*2);
  }
  if(sc.id==='slop'){
    const txt='сделай крутое видео', ts=wt(sc,'«сделай'), te=wt(sc,'видео')+.35;
    const n=Math.round(clamp((t-ts)/(te-ts))*txt.length); $('slopTyped').textContent=txt.slice(0,n);
    $('slopCaret').style.opacity=(Math.floor(t*3)%2)?1:0; $('slopBubble').style.opacity=clamp(lt/.2);
    const tb=te; const b=$('slopBox'); pop(b,(t-tb)/.4,.6);
    b.style.transform+=` translateX(${t>tb&&t<tb+.5?Math.sin(t*90)*4:0}px)`;
    const tm=wt(sc,'мыло'); $('x1').style.strokeDashoffset=1-eo((t-tm)/.18); $('x2').style.strokeDashoffset=1-eo((t-tm-.12)/.18);
    if(t>tm) fl=Math.max(0,.35-(t-tm)*1.5);
  }
  if(sc.id==='engine'){
    pop($('engCore'),lt/.4,.5); $('engCore').style.transform+=` translateY(${Math.sin(t*3)*3}px)`;
    ['секунды','камера','свет','звук'].forEach((w,i)=>{const tt=wt(sc,w);const e=$('c'+i);pop(e,(t-tt+.05)/.35,.2);if(t>tt)e.style.transform+=` translateY(${Math.sin(t*2.4+i)*4}px)`});
  }
  if(sc.id==='prompt'){
    pop($('ideaCard'),lt/.35,.5);
    const ta=wt(sc,'одна'); $('arrowPath').style.strokeDashoffset=1-eo((t-ta)/.35);
    const tp=wt(sc,'готовый')-.1, tend=sc.end-.4; const pc=$('promptCard'); pc.style.opacity=clamp((t-ta)/.3);
    const k=clamp((t-tp)/(tend-tp)); const shown=Math.floor(k*PROMPT.length);
    let html='';PROMPT.slice(0,shown).forEach(l=>{html+=l.replace(/(\[[^\]]+\])/,'<span style="color:#ffd23f">$1</span>').replace(/^(\s*[A-Z]+:)/,'<span style="color:#ff3d8b">$1</span>')+'<br>'});
    $('promptLines').innerHTML=html;
    const tn=wt(sc,'двадцать'); const cnt=Math.round(clamp((t-tp)/(tn+.3-tp))*20);
    const lc=$('lineCount'); lc.textContent=cnt+' строк'; lc.style.opacity=clamp((t-tp)/.2);
    lc.style.transform=`scale(${1+(t>tn?Math.exp(-(t-tn)*6)*.35:0)})`;
  }
  if(sc.id==='grid'){
    const groups={v:wt(sc,'просмотров'),b:wt(sc,'бизнеса'),r:wt(sc,'бренда')};
    const col={v:['#ff3d8b','rgba(255,61,139,.55)'],b:['#ffd23f','rgba(255,210,63,.5)'],r:['#7b5cff','rgba(123,92,255,.6)']};
    for(let i=0;i<10;i++){const e=$('sk'+i);const g=e.dataset.g;const p0=eo((lt-.05*i)/.3);
      const active=t>=groups[g]; const cur=(g==='v'&&t<groups.b)||(g==='b'&&t>=groups.b&&t<groups.r)||(g==='r'&&t>=groups.r);
      const ap=active?eo((t-groups[g])/.3):0;
      e.style.opacity=p0; e.style.transform=`scale(${(.85+.15*p0)*(1+(cur?.04*ap:0))})`;
      e.style.borderColor=active?col[g][0]:'rgba(255,255,255,.08)';
      e.style.boxShadow=cur?`0 0 ${24*ap}px ${col[g][1]}`:'none';
      e.style.color=active?(cur?'#fff':'rgba(255,255,255,.7)'):'rgba(255,255,255,.35)';
      e.firstChild.style.color=active?col[g][0]:'rgba(255,255,255,.35)';
      e.style.background=cur?'#2c2142':'#221a33';
    }
  }
  if(sc.id==='hook2s'){
    const e=$('sec'); pop(e,lt/.4,.3); const td=wt(sc,'две'); e.style.transform+=` scale(${1+(t>td?Math.exp(-(t-td)*5)*.2:0)})`;
    const t1=wt(sc,'пятьдесят'),t2=wt(sc,'девяносто');
    const p1=eo((t-t1+.1)/.6),p2=eo((t-t2+.1)/.6);
    $('b1').style.width=50*p1+'%'; $('v1').textContent=Math.round(50*p1)+'%';
    $('b2').style.width=90*p2+'%'; $('v2').textContent=Math.round(90*p2)+'%';
    if(t>t2) fl=Math.max(0,.3-(t-t2)*1.2);
  }
  if(sc.id==='cta'){
    const cmd='python install.py --all'; const ts=sc.start+.15, te=wt(sc,'кидай');
    $('term').style.opacity=clamp(lt/.2);
    $('termTyped').textContent=cmd.slice(0,Math.round(clamp((t-ts)/(te-ts))*cmd.length));
    $('termCaret').style.opacity=(Math.floor(t*3)%2)?1:0;
    $('termOk').style.opacity=clamp((t-te-.1)/.2);
    const fls=document.querySelectorAll('.fl'); const tf=[wt(sc,'идею'),wt(sc,'идею')+.2,wt(sc,'забирай'),wt(sc,'забирай')+.2,wt(sc,'промпт')+.2];
    fls.forEach((f,i)=>{const p=(t-tf[i])/.3;f.style.opacity=clamp(p*3);f.style.transform=`scale(${.4+.6*back(p)})`;f.style.display='inline-block'});
    const tsub=wt(sc,'подпишись'); if(t>tsub){const hl2=$('headline');if(hl2.dataset.k!=='sub'){hl2.innerHTML='Подпишись<br><span class="p">а то кадр смажется</span>';hl2.dataset.k='sub'}hl2.style.transform=`scale(${.7+.3*back((t-tsub)/.35)})`;}
  }
  $('flash').style.opacity=fl;

  // ---------- mascot
  const m=$('mascot'); const bob=Math.sin(t*2.6)*6; const tilt=Math.sin(t*1.7)*4;
  // clap at scene start
  const since=lt; const clap=since<.35?Math.sin(clamp(since/.35)*Math.PI):0;
  let armOpen=10*(1-clap)+(-18)*0; // resting slightly open
  armOpen = since<.35 ? 10 - 10*Math.sin(clamp(since/.35)*Math.PI) - 12*(since<.12?since/.12:0)*(since<.35?1:0) : 10;
  // talking: arm flaps a bit on each word start
  let talk=0; for(const w of sc.words){const d=t-w.t; if(d>=0&&d<.18) talk=Math.max(talk,Math.sin(d/.18*Math.PI));}
  $('mArm').style.transform=`rotate(${-(armOpen*0.6)-talk*7}deg)`;
  m.style.transform=`translateY(${bob - clap*10}px) rotate(${tilt}deg) scale(${1+clap*.06})`;
  // blink
  const bl=(t%3.1)<.12?.15:1; $('e1').setAttribute('ry',8*bl); $('e2').setAttribute('ry',8*bl);
  // eyes look
  const look=Math.sin(t*.9)*3; $('mEyes').setAttribute('transform',`translate(${look},0)`);
  $('mMouth').setAttribute('d',`M84 110 Q91 ${112+talk*8} 98 110`);
  // mascot surprise: big pop on highlighted words
  let hlp=0; for(const w of sc.words){if(!w.hl)continue;const d=t-w.t;if(d>=0&&d<.3)hlp=Math.max(hlp,Math.sin(d/.3*Math.PI))}
  m.style.transform+=` scale(${1+hlp*.08})`;

  // ---------- captions (karaoke by phrase)
  const words=sc.words; const phrases=[]; let cur=[];
  words.forEach((w,i)=>{cur.push(w); if(/[.?!:]$/.test(w.w)||cur.length>=6&&/[,]$/.test(w.w)||cur.length>=7){phrases.push(cur);cur=[]}}); if(cur.length)phrases.push(cur);
  let ph=phrases[0]; for(const p of phrases){if(t>=p[0].t-.05) ph=p}
  const cap=$('caption'); let html='';
  for(const w of ph){const said=t>=w.t-.02; const cls=said?(w.hl?'w-hl':'w-on'):'w-dim'; html+=`<span class="${cls}">${w.w}</span> `}
  cap.innerHTML=html;
}
window.build=build; window.render=render;
